quarkus.application.name=ms-enterprise-person-service
quarkus.http.port=8080
quarkus.http.limits.max-body-size=20M

quarkus.datasource.db-kind=mssql
quarkus.datasource.reactive.url=${DB_URL}
quarkus.datasource.username=${DB_USERNAME}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.reactive.max-size=10
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.dialect=org.hibernate.dialect.SQLServerDialect

mp.openapi.extensions.smallrye.info.title=API de personas
mp.openapi.extensions.smallrye.info.version=1.0.0
mp.openapi.extensions.smallrye.info.description=API para consultar personas y procesar cargas masivas desde Excel en SQL Server.

personas.batch.tamano-lote=100
personas.archivo.maximo-bytes=20971520
